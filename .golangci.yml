version: "2"

linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - exhaustruct
    # 2.13 renamed this linter, same as wsl -> wsl_v5 below. `default: all`
    # auto-enables the new name, so both have to be listed.
    - exhaustruct_v5
    - gochecknoglobals
    - gochecknoinits
    - goconst # over-aggressive
    - gocyclo # gocognit covers complexity
    - godoclint
    - godox
    - gomodguard # deprecated
    - ireturn
    - mnd
    - nestif
    - nlreturn
    - noinlineerr # inline error handling is the house style
    - paralleltest
    - protogetter
    - tagliatelle
    # White-box tests are the convention here: tests construct unexported
    # types and call unexported helpers in nearly every package.
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    # Length and nesting are the linter's job, not a reviewer's: a function past these
    # limits is split before it is reviewed. Tests are excluded below (a table test is long).
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocritic:
      disabled-checks:
        - commentFormatting
    gosec:
      excludes:
        # The search and engine planes shell out to git, zoekt and ctags by
        # design; arguments are built from validated config, not user input.
        - G204
        # int -> int32 for Postgres columns and counters bounded far below
        # the limit; flagging every conversion buries real findings.
        - G115
    govet:
      enable-all: true
      disable:
        # Reordering fields by GC scan size breaks their logical grouping
        # for a few bytes on structs that are not on a hot path.
        - fieldalignment
        # Nearly every hit is the idiomatic `if err := ...` in an inner scope.
        - shadow
    lll:
      line-length: 200
    nolintlint:
      # A suppression says why, so a reviewer can tell a judgement from a
      # silenced finding.
      require-explanation: true
      require-specific: true
    funcorder:
      struct-method: false
    wrapcheck:
      extra-ignore-sigs:
        # Returns the error from the caller-supplied fn verbatim; that fn wraps.
        - singleflight.Group).Do(
        # River job-control signals, matched by errors.As; the inner error
        # passed to JobCancel carries the context.
        - river.JobCancel(
        - river.JobSnooze(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gocognit
          - wrapcheck
          - err113
          - gosec
        path: _test\.go
      # The CLIs write their output to stdout; printing is their job.
      - linters:
          - forbidigo
        path: ^cmd/
      - linters:
          - lll
        source: "^//go:generate "
      # Over budget when the limits were set (2026-10-16). A ratchet: split one
      # and delete its line; never add one.
      - { linters: [funlen], path: '^cmd/exemplar/adversarial\.go$', text: 'Function ''newAdversarialCmd'' ' }
      - { linters: [funlen], path: '^cmd/exemplar/calibrate\.go$', text: 'Function ''newCalibrateCmd'' ' }
      - { linters: [funlen], path: '^cmd/exemplar/eval\.go$', text: 'Function ''newEvalCmd'' ' }
      - { linters: [funlen], path: '^cmd/exemplar/eval\.go$', text: 'Function ''remoteEval'' ' }
      - { linters: [funlen], path: '^cmd/exemplar/mutations\.go$', text: 'Function ''runMutations'' ' }
      - { linters: [funlen], path: '^cmd/exemplar/replay\.go$', text: 'Function ''newReplayCmd'' ' }
      - { linters: [funlen], path: '^cmd/exemplar/review\.go$', text: 'Function ''newReviewCmd'' ' }
      - { linters: [funlen], path: '^cmd/exemplar/try\.go$', text: 'Function ''newTryCmd'' ' }
      - { linters: [funlen], path: '^cmd/exemplar-api/main\.go$', text: 'Function ''run'' ' }
      - { linters: [funlen], path: '^cmd/exemplar-learn/compile\.go$', text: 'Function ''runCompile'' ' }
      - { linters: [funlen], path: '^cmd/exemplar-learn/ingest\.go$', text: 'Function ''runIngest'' ' }
      - { linters: [funlen], path: '^cmd/exemplar-learn/pathevents\.go$', text: 'Function ''runPathEvents'' ' }
      - { linters: [funlen], path: '^cmd/exemplar-search/serve\.go$', text: 'Function ''runServe'' ' }
      - { linters: [funlen], path: '^cmd/exemplar-webhook/main\.go$', text: 'Function ''run'' ' }
      - { linters: [funlen], path: '^cmd/exemplar-worker/main\.go$', text: 'Function ''runServe'' ' }
