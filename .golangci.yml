version: "2"

linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - exhaustruct
    # 2.13 renamed this linter, same as wsl -> wsl_v5 below. `default: all`
    # auto-enables the new name, so both have to be listed.
    - exhaustruct_v5
    - gochecknoglobals
    - gochecknoinits
    - goconst # over-aggressive
    - gocyclo # gocognit covers complexity
    - godoclint
    - godox
    - gomodguard # deprecated
    - ireturn
    - mnd
    - nestif
    - nlreturn
    - noinlineerr # inline error handling is the house style
    - paralleltest
    - protogetter
    - tagliatelle
    # White-box tests are the convention here: tests construct unexported
    # types and call unexported helpers in nearly every package.
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    # Length and nesting are the linter's job, not a reviewer's: a function past these
    # limits is split before it is reviewed. Tests are excluded below (a table test is long).
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocritic:
      disabled-checks:
        - commentFormatting
    gosec:
      excludes:
        # The search and engine planes shell out to git, zoekt and ctags by
        # design; arguments are built from validated config, not user input.
        - G204
        # int -> int32 for Postgres columns and counters bounded far below
        # the limit; flagging every conversion buries real findings.
        - G115
    lll:
      line-length: 200
    nolintlint:
      # A suppression says why, so a reviewer can tell a judgement from a
      # silenced finding.
      require-explanation: true
      require-specific: true
    funcorder:
      struct-method: false
    wrapcheck:
      extra-ignore-sigs:
        # Returns the error from the caller-supplied fn verbatim; that fn wraps.
        - singleflight.Group).Do(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gocognit
          - wrapcheck
          - err113
          - gosec
        path: _test\.go
      # The CLIs write their output to stdout; printing is their job.
      - linters:
          - forbidigo
        path: ^cmd/
      - linters:
          - lll
        source: "^//go:generate "
      # Frozen when wrapcheck and err113 were enabled (2026-10-16): these files
      # return unwrapped or ad-hoc errors. A ratchet: fix a file and delete its
      # line; never add one. New files must comply.
      - { linters: [wrapcheck, err113], path: '^cmd/exemplar-api/main\.go$' }
      - { linters: [wrapcheck, err113], path: '^cmd/exemplar-gateway/main\.go$' }
