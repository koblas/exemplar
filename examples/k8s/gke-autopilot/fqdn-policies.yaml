apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: exemplar-cloudflared-hosts
  namespace: exemplar
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: exemplar-cloudflared}}
  egress:
    # Cloudflare's tunnel edge (QUIC, falling back to HTTP/2).
    - matches:
        - pattern: "*.v2.argotunnel.com"
      ports: [{protocol: UDP, port: 7844}, {protocol: TCP, port: 7844}]
