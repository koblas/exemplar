# The installation's two values (README.md). Everything about the GitHub
# App comes from exemplar-api's setup page as the exemplar-github-app
# Secret. Sign-in defaults to members of the config repo's owner (acme);
# to change that, patch the exemplar-auth ConfigMap (deploy/k8s/core).
apiVersion: v1
kind: ConfigMap
metadata:
  name: exemplar-settings
  namespace: exemplar
data:
  EXEMPLAR_CONFIG_REPO: "acme/exemplar-config"
  EXEMPLAR_API_URL: "https://exemplar.acme.com"
  # GitHub Enterprise Server:
  # EXEMPLAR_GH_WEB_URL: "https://github.acme.com/"
  # EXEMPLAR_GH_API_URL: "https://github.acme.com/api/v3/"
