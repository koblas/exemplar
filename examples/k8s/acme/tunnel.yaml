# The Cloudflare Tunnel's id and host names (README.md, step 7). Keep the
# webhook's path rule and the catch-all. Drop this patch for an Ingress-only
# build (deploy/k8s/direct).
apiVersion: v1
kind: ConfigMap
metadata:
  name: exemplar-cloudflared
  namespace: exemplar
data:
  config.yaml: |
    tunnel: <tunnel-id>
    credentials-file: /etc/cloudflared/credentials/credentials.json
    ingress:
      - hostname: exemplar-webhook.acme.com
        path: ^/webhook$
        service: http://exemplar-webhook.exemplar.svc:80
      - hostname: exemplar.acme.com
        service: http://exemplar-api.exemplar.svc:80
      - service: http_status:404
