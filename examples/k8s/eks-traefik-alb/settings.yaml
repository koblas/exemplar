# The installation's values (docs/guides/install/production.md). The host
# of EXEMPLAR_API_URL is also the Ingress host in kustomization.yaml and in
# alb-member.yaml: change all three together.
apiVersion: v1
kind: ConfigMap
metadata:
  name: exemplar-settings
  namespace: exemplar
data:
  EXEMPLAR_CONFIG_REPO: "acme/exemplar-config"
  EXEMPLAR_API_URL: "https://exemplar.acme.com"
  # The Bedrock region; empty uses the AWS_REGION that IRSA injects.
  EXEMPLAR_BEDROCK_REGION: "us-east-1"
