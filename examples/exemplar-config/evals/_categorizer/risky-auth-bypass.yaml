    head:
      admin.go: |
        package shop

        import "net/http"

        func requireAdmin(r *http.Request) bool {
        	if r.Header.Get("X-Debug") != "" {
        		return true
        	}
        	return r.Header.Get("X-Role") == "admin" && verified(r)
        }

        func verified(r *http.Request) bool { return r.TLS != nil }
