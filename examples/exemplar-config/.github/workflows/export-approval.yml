name: export-approval

# Changes to a rule's export: block reach every coding agent in the org
# through exported instruction files, so they need an approval from
# @platform/devex in addition to the rule owner.
# CODEOWNERS works per file, not per YAML key, hence this check. It reruns
# on reviews, and counts only approvals of the PR's current head.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  export-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the diff against the PR's base
      # The released CLI for your installation's version (EXEMPLAR_VERSION).
      - uses: ./.github/actions/setup-exemplar
        with:
          version: ${{ vars.EXEMPLAR_VERSION }}
      - name: Check export approval
        env:
          GITHUB_TOKEN: ${{ github.token }} # reads this PR's reviews
          # Reads @platform/devex membership (members: read); GITHUB_TOKEN cannot.
          EXEMPLAR_TEAMS_TOKEN: ${{ secrets.EXEMPLAR_TEAMS_TOKEN }}
        run: >-
          "$RUNNER_TEMP/exemplar" export-approval --config .
          --changed-since "${{ github.event.pull_request.base.sha }}"
          --pr "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --author "${{ github.event.pull_request.user.login }}"
          --markdown "$GITHUB_STEP_SUMMARY"
