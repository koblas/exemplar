[project]
name = "exemplar-learning"
version = "0.1.0"
description = "Exemplar learning-plane batch jobs: embed, cluster and rank (spec §8.3-8.5). Reads and writes Postgres tables only; no API surface."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Add numeric and clustering libraries (numpy, faiss-cpu, scikit-learn,
# networkx/igraph, pgvector) with the jobs that need them, not before.
dependencies = [
    "pydantic>=2.10",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "numpy>=2.5.4",
    "faiss-cpu>=1.15.1",
    "python-igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "pgvector>=0.5.1",
    "anthropic>=1.13.0",
]

[project.scripts]
exemplar-learning = "exemplar_learning.cli:main"

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.26",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exemplar_learning"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated from ../schema; the generator formats it (scripts/gen-contracts.sh).
extend-exclude = ["src/exemplar_learning/contracts/rule.py", "src/exemplar_learning/contracts/global_config.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
# The formatter owns line length; long string literals (SQL, prompts) stay whole.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses are safe as argument defaults.
extend-immutable-calls = [
    "exemplar_learning.cluster.graph.Params",
    "exemplar_learning.rank.score.Params",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                               # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
