name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The plain and race runs are separate legs so they run at the same time.
  test:
    name: test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, race]
    env:
      # Postgres tests start their own pgvector container (testcontainers-go)
      # on the runner's Docker; fail rather than skip if it is unavailable.
      EXEMPLAR_REQUIRE_DB: "1"
      # Real ast-grep, Semgrep and universal-ctags runs (compiled rules, compile
      # attempts, exemplar-search symbols); fail rather than skip without them.
      EXEMPLAR_REQUIRE_ENGINES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's cache key is shared by every job here, and whichever
          # job finishes first saves it (docs, vuln, generated), so the
          # test legs would restore none of their own build. Each leg keeps
          # its own cache instead, saved from main after the tests.
          cache: false
      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ matrix.mode }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ matrix.mode }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ matrix.mode }}-${{ runner.os }}-
      # Same versions as devenv.nix.
      - name: Install engines
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q universal-ctags clang-format ripgrep
          npm install -g @ast-grep/cli@0.45.1
          pipx install semgrep==1.172.0
          ast-grep --version && semgrep --version && ctags --version | head -1 && clang-format --version && rg --version | head -1
      - if: matrix.mode == 'plain'
        run: go build ./...
      - if: matrix.mode == 'plain'
        run: go test ./...
      - if: matrix.mode == 'race'
        run: go test -race ./...
      # Saved from main only: pull requests restore main's cache, and a save
      # per pull request run would push it out of the repository's quota.
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ matrix.mode }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: sqlc output is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff -f db/sqlc.yaml

  # release-please builds CHANGELOG.md and the next version from these
  # subjects, so every commit a pull request brings to main must parse.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commit subjects are Conventional Commits
        run: make commitlint COMMIT_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # The reference pages cover the code (go test ./docs) and the site
  # builds with no broken links (make docs).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
      - run: make docs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Short fuzz runs on every change; seed corpora and saved regressions in
  # testdata/fuzz already run as ordinary tests in the test job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=30s ./internal/scope
      - run: go test -run='^$' -fuzz='^FuzzValidateAnchor$' -fuzztime=30s ./internal/scope

  # On every change: the adversarial set in compromised mode needs no
  # model access. Live mode runs where a gateway is available.
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run ./cmd/exemplar validate examples/exemplar-config
      - run: go run ./cmd/exemplar adversarial --config examples/exemplar-config --mode compromised
      - run: go run ./cmd/exemplar replay --config examples/exemplar-config --fixtures examples/fixtures --scripted --baseline --out replay.json

  # Learning-plane Python jobs (learning/): lint, tests, and the check that
  # the generated contract models match schema/.
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning
    env:
      EXEMPLAR_REQUIRE_DB: "1"  # the cluster job test needs Docker; fail rather than skip
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: ./scripts/gen-contracts.sh --check

  # The deploy images build (nothing is pushed; images.yml publishes them
  # from main and v* tags), and the manifests are rendered and schema-checked.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/docker/Dockerfile -t exemplar:ci .
      - run: docker build -f deploy/docker/learning.Dockerfile -t exemplar-learning:ci .
      - name: Engines are in the image
        run: docker run --rm --entrypoint sh exemplar:ci -c 'ast-grep --version && semgrep --version && ctags --version | head -1 && clang-format --version && git --version && exemplar-worker --help 2>&1 | head -1'
      # Each inbound build: the tunnel default, an Ingress, and both (an
      # overlay of the default with the ingress component).
      - name: Render and schema-check the manifests
        run: |
          mkdir -p deploy/k8s/ci-both
          printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../base]\ncomponents: [../components/ingress]\n' > deploy/k8s/ci-both/kustomization.yaml
          mkdir -p deploy/k8s/ci-postgres
          printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../base]\ncomponents: [../components/postgres]\n' > deploy/k8s/ci-postgres/kustomization.yaml
          for v in base direct ci-both ci-postgres; do
            kubectl kustomize deploy/k8s/$v > rendered-$v.yaml
            go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary -kubernetes-version 1.33.0 rendered-$v.yaml
          done
          # The example installation overlays (docs/tutorials/quickstart.md, docs/guides/install/).
          for ex in acme quickstart quickstart-direct; do
            kubectl kustomize examples/k8s/$ex > rendered-example-$ex.yaml
            go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary -kubernetes-version 1.33.0 rendered-example-$ex.yaml
          done
          # The release's install manifests, with placeholder digests.
          deploy/render-release.sh v0.0.0 "sha256:$(printf '1%.0s' $(seq 64))" "sha256:$(printf '2%.0s' $(seq 64))" rendered-release
          go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary -kubernetes-version 1.33.0 rendered-release/install-*.yaml
