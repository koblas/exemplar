name: release-please

# Cuts releases from the Conventional Commits on main (see CONTRIBUTING.md,
# "Releasing"). Every push to main updates one open release PR that bumps
# .release-please-manifest.json and prepends the new CHANGELOG.md entry.
# Merging that PR tags v<version> and creates its GitHub release, whose notes
# are the changelog entry; this workflow then builds and attaches the CLI
# archives (release.yml), pushes the version-tagged images (images.yml),
# and attaches install manifests pinned to those images' digests.
#
# release-please signs in with GITHUB_TOKEN. Tags and PRs made with it start
# no other workflow, so the builds are called here rather than from the tag
# push, and the release PR runs no CI (it only touches CHANGELOG.md and the
# manifest). The repository must allow GitHub Actions to create pull
# requests (Settings > Actions > General > Workflow permissions).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  cli:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # The install manifests, pinned to the digests images.yml just pushed
  # (docs/reference/releases.md). After cli, which makes sure the release exists.
  manifests:
    needs: [release-please, images, cli]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/manifests.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
