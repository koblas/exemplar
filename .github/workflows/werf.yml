name: werf

# Builds both deploy images with werf (werf.yaml) and pushes each to its own
# GHCR repository (ghcr.io/koblas/exemplar, ghcr.io/koblas/exemplar-learning):
# on every push to main, for each release
# (release-please.yml calls this with the new tag; a v* tag pushed by hand
# does the same), and by hand. It runs alongside images.yml, which stays the
# release path: release-please.yml and manifests.yml read the Docker Hub tags
# images.yml pushes, and nothing reads these. A pull request that touches the
# werf config or the Dockerfiles builds without pushing (local stage storage,
# no registry login). A called run sees the caller's ref (main), so it checks
# out the tag input instead, and leaves the main and sha- tags to main's own
# run.
#
# One job per image, each building only its image into its repository.
# werf stores the image under a content-based tag and keeps its stages in
# that repository, so an unchanged image is not rebuilt. Each image also
# gets readable tags:
#   sha-<short>   every push
#   main          the tip of main
#   latest        the newest release
# The step summary lists the digest and the kustomize images entry that
# pins it.
#
# werf ci-env signs in to GHCR with GITHUB_TOKEN (packages: write); no other
# secret is needed. werf needs the full history (fetch-depth: 0).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - werf.yaml
      - werf-giterminism.yaml
      - .github/workflows/werf.yml
      - deploy/docker/**
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and push, such as v0.2.0
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: werf-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # The Dockerfiles use BuildKit syntax (RUN --mount=type=cache,
  # ADD --checksum).
  DOCKER_BUILDKIT: "1"
  # The release tag, empty for other builds.
  RELEASE: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  EXEMPLAR_VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.sha }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [exemplar, exemplar-learning]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
      - uses: werf/actions/install@v2
        with:
          version: v2.83.0
      - name: Build without pushing
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
        run: werf build "$IMAGE"
      - name: Build and push
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          . "$(werf ci-env github --as-file)"
          if [ -n "$RELEASE" ]; then
            tags=(--add-custom-tag latest)
          else
            tags=(--add-custom-tag "sha-${SHORT_SHA::7}")
            if [ "$REF_NAME" = main ]; then
              tags+=(--add-custom-tag main)
            fi
          fi
          werf build "$IMAGE" --repo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}" "${tags[@]}" \
            --save-build-report --build-report-path werf-build-report.json
      - name: Summarize the pushed digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "### werf build: ${IMAGE}"
            echo
            jq -r '.Images | to_entries[] | "- `\(.key)`: `\(.value.DockerImageName)`, digest `\(.value.DockerImageDigest)`"' werf-build-report.json
            echo
            echo "Kustomize pin:"
            echo '```yaml'
            jq -r '.Images | to_entries[] | "  - name: \(.key)\n    newName: \(.value.DockerRepo)\n    digest: \(.value.DockerImageDigest)"' werf-build-report.json
            echo '```'
            echo
            echo "<details><summary>Build report</summary>"
            echo
            echo '```json'
            cat werf-build-report.json
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
