name: images

# Builds both deploy images and pushes each to its own Docker Hub repository
# (koblas/exemplar for the Go services, koblas/exemplar-learning for the
# learning plane):
# on every push to main, for each release (release-please.yml calls this
# with the new tag; a v* tag pushed by hand does the same), and by hand. A
# called run sees the caller's ref (main), so it checks out and tags from
# the tag input instead, and leaves the main and sha- tags to main's own run. There is no paths
# filter: GitHub applies one to tag pushes too, which would skip releases,
# and the services image takes in nearly the whole tree anyway; the layer
# cache makes an unchanged image cheap to rebuild.
#
# Both repositories take the same tags. Each job writes the
# pushed digest and the kustomize images entry that pins it to the step
# summary (see docs/reference/workloads.md, "What an installation supplies").
#
# Signs in as the koblas Docker Hub user with the DOCKERHUB_PAT repository
# secret (a personal access token with read/write on both repositories). Pull
# requests never push; ci.yml's images job already checks that both build.
#
# Tags:
#   sha-<short>          every push
#   main                 the tip of main
#   <version>, <x.y>     v* tags, without the "v"
#   latest               the newest release
#
# The services binaries report the release tag (exemplar --version), or the
# commit for other builds.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and push, such as v0.2.0
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: exemplar, dockerfile: deploy/docker/Dockerfile, image: koblas/exemplar}
          - {name: exemplar-learning, dockerfile: deploy/docker/learning.Dockerfile, image: koblas/exemplar-learning}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: koblas
          password: ${{ secrets.DOCKERHUB_PAT }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,enable=${{ !inputs.tag }}
            type=ref,event=branch,enable=${{ !inputs.tag }}
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.tag != '' || github.ref_type == 'tag' }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The services image is amd64 only (the ast-grep release binary).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Summarize the pushed digest
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${NAME}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Kustomize pin:"
            echo '```yaml'
            echo "  - name: ${NAME}"
            echo "    newName: docker.io/${IMAGE}"
            echo "    digest: ${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
