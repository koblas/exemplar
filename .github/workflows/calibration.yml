name: calibration

# Verifier and auto-approve risk categorizer calibration on every change to
# their prompts, decision code or model routing,
# against the example config's seed labels. The categorizer half is
# skipped while the example config has no providers.categorizer. It needs a
# gateway; without the EXEMPLAR_GATEWAY_URL and EXEMPLAR_GATEWAY_TOKEN secrets
# the job passes with a warning and calibration does not run.
on:
  pull_request:
    paths:
      - internal/engine/prompts.go
      - internal/engine/verify.go
      - internal/engine/verifyonly.go
      - internal/llm/**
      - internal/engine/categorize.go
      - internal/gates/stage2.go
      - examples/exemplar-config/evals/_verifier/**
      - examples/exemplar-config/evals/_categorizer/**

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Check for gateway secrets
        id: secrets
        env:
          EXEMPLAR_GATEWAY_URL: ${{ secrets.EXEMPLAR_GATEWAY_URL }}
          EXEMPLAR_GATEWAY_TOKEN: ${{ secrets.EXEMPLAR_GATEWAY_TOKEN }}
        run: |
          if [ -z "$EXEMPLAR_GATEWAY_URL" ] || [ -z "$EXEMPLAR_GATEWAY_TOKEN" ]; then
            echo "::warning::calibration skipped: the EXEMPLAR_GATEWAY_URL and EXEMPLAR_GATEWAY_TOKEN secrets are not set"
            echo "Calibration skipped: the gateway secrets are not set." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Calibrate the verifier and categorizer
        if: steps.secrets.outputs.ok == 'true'
        env:
          EXEMPLAR_GATEWAY_URL: ${{ secrets.EXEMPLAR_GATEWAY_URL }}
          EXEMPLAR_GATEWAY_TOKEN: ${{ secrets.EXEMPLAR_GATEWAY_TOKEN }}
        run: go run ./cmd/exemplar calibrate --config examples/exemplar-config --markdown "$GITHUB_STEP_SUMMARY"
