id: no-secrets-in-logs
kind: exemplar
category: Security
severity: important
owner: "@security/appsec"
status: active
review_by: 2027-10-01
file_patterns: ["**/*.{go,py,js,jsx,mjs,cjs,ts,tsx,java,kt,kts,scala,rb,php,cs,rs,swift,c,cc,cpp,h,hpp,ex,exs,sh}", "!**/{test,tests,__tests__,spec,testdata,fixtures}/**", "!**/*{_test,.test,.spec,_spec}.*", "!**/test_*.py"]
description: |
  Logs, metrics labels, traces and error messages are read by far more people
  and systems than the data they describe. Credentials and personal data must
  not reach them.
preferred_approach: |
  Log identifiers (user id, request id, key id), not values. Redact or omit
  secrets before building log fields, and log the shape of a payload (size,
  type, field names) instead of the payload itself.
what_to_flag: |
  - Passwords, API keys, tokens, session ids, cookies, private keys or
    connection strings with credentials written to a log, trace, metric
    label, or an error message returned to callers.
  - Whole request or response bodies, headers (Authorization, Cookie) or
    config objects logged where they may carry any of the above.
  - Personal data (email, phone, address, government id, card number)
    logged in full.
  Do not flag logging of ids, counts, or values already redacted or hashed.
fix_policy: suggest
citation:
  doc: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
export:
  agents: true
  summary: "Never log credentials, tokens, whole payloads or personal data; log ids instead."
