# GitHub posts webhooks here: EXEMPLAR_API_URL's host plus /webhook, or
# EXEMPLAR_WEBHOOK_URL's host. Host, class and TLS secret are set by the
# overlay; restrict /webhook to GitHub's hook CIDRs (api.github.com/meta).
# If a load balancer in front of the controller terminates TLS, the overlay
# removes spec.tls ({op: remove, path: /spec/tls}): the certificate lives on
# the load balancer, not in exemplar-*-tls, and Traefik serves an Ingress
# with spec.tls only on TLS routers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exemplar-webhook
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-webhook, app.kubernetes.io/part-of: exemplar}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [exemplar.example.invalid]
      secretName: exemplar-webhook-tls
  rules:
    - host: exemplar.example.invalid
      http:
        paths:
          - path: /webhook
            pathType: Exact
            backend:
              service:
                name: exemplar-webhook
                port: {name: http}
---
# People open feedback links here. The overlay sets host,
# class and TLS, and puts org SSO in front (an IdP-aware proxy or ingress
# auth annotations) for everything but /webhook.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exemplar-api
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-api, app.kubernetes.io/part-of: exemplar}
spec:
  ingressClassName: nginx
  tls:
    - hosts: [exemplar.example.invalid]
      secretName: exemplar-api-tls
  rules:
    - host: exemplar.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exemplar-api
                port: {name: http}
---
# The controller's namespace may reach the webhook and the API. The overlay
# must set it to the cluster's controller's namespace unless that is
# ingress-nginx (path .../matchLabels/kubernetes.io~1metadata.name). A load
# balancer that sends to pod addresses itself (ALB target-type ip, no
# controller) comes from the VPC's CIDR instead: an ipBlock, not a namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exemplar-webhook-from-ingress
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-webhook, app.kubernetes.io/part-of: exemplar}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: exemplar-webhook}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exemplar-api-from-ingress
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-api, app.kubernetes.io/part-of: exemplar}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: exemplar-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8080}
