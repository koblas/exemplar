# The in-cluster database's Secrets, declared empty: exemplar-api's setup
# writes a new password and its URL into them (internal/setup), before the
# GitHub App exists, so Postgres starts while the operator registers it.
apiVersion: v1
kind: Secret
metadata:
  name: exemplar-postgres
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-postgres, app.kubernetes.io/part-of: exemplar}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: exemplar-database
  namespace: exemplar
  labels: {app.kubernetes.io/part-of: exemplar}
type: Opaque
