# exemplar-postgres: a single Postgres 16 with pgvector on a persistent
# volume. It is a convenience for small installations and evaluation, not a
# replacement for a managed database: one replica, no replication, no
# backups. Its superuser password is in the exemplar-postgres Secret
# (password); the exemplar-database Secret's url uses the same password.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exemplar-postgres
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-postgres, app.kubernetes.io/part-of: exemplar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: exemplar-postgres
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-postgres, app.kubernetes.io/part-of: exemplar}
spec:
  selector: {app.kubernetes.io/name: exemplar-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: exemplar-postgres
  namespace: exemplar
  labels:
    app.kubernetes.io/name: exemplar-postgres
    app.kubernetes.io/part-of: exemplar
spec:
  # One writer; there is no replication. No PodDisruptionBudget: with one
  # replica it would only block node drains.
  replicas: 1
  serviceName: exemplar-postgres
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: exemplar-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exemplar-postgres
        app.kubernetes.io/part-of: exemplar
    spec:
      serviceAccountName: exemplar-postgres
      automountServiceAccountToken: false
      # The preStop fast shutdown has 30 s (--timeout); SIGTERM then finds
      # it stopped.
      terminationGracePeriodSeconds: 45
      # The image's postgres user. Its USER is root, so the restricted
      # level needs these set; fsGroup makes the volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          # pgvector 0.8.0 on Postgres 16, the image the store tests use
          # (internal/store/storetest); the multi-arch index digest.
          image: docker.io/pgvector/pgvector:0.8.0-pg16@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
          command: ["docker-entrypoint.sh"]
          args: ["postgres"]
          env:
            # The superuser; it owns the database, so migrations can
            # CREATE EXTENSION vector.
            - {name: POSTGRES_USER, value: exemplar}
            - {name: POSTGRES_DB, value: exemplar}
            - {name: POSTGRES_PASSWORD_FILE, value: /etc/postgres/secret/password}
            # A subdirectory: initdb refuses a volume root holding lost+found.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          # pg_isready over TCP: during first-start init the entrypoint's
          # temporary server listens only on the socket, so the pod is not
          # ready until the real server is. The startup probe allows 10
          # minutes for crash recovery before liveness counts.
          startupProbe:
            exec:
              command: ["pg_isready", "--host=127.0.0.1", "--port=5432"]
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "--host=127.0.0.1", "--port=5432"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "--host=127.0.0.1", "--port=5432"]
            periodSeconds: 5
            timeoutSeconds: 5
          # SIGTERM is a smart shutdown, which waits for every pooled client
          # to disconnect. Stop fast instead: roll back open transactions,
          # checkpoint, exit.
          lifecycle:
            preStop:
              exec:
                command: ["pg_ctl", "stop", "--mode=fast", "--wait", "--timeout=30"]
          # A starting point; re-size with the data (shared_buffers is the
          # image default, 128 MB).
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: secret, mountPath: /etc/postgres/secret, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: shm, mountPath: /dev/shm}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secret
          secret:
            secretName: exemplar-postgres
            items: [{key: password, path: password}]
            defaultMode: 0400
        - name: run
          emptyDir: {sizeLimit: 16Mi}
        # The runtime's 64 MB /dev/shm is too small for parallel queries.
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
  # The cluster's default storage class; an overlay sets the class and size.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/name: exemplar-postgres, app.kubernetes.io/part-of: exemplar}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 50Gi}
