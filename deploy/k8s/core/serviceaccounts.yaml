# One identity per binary, and one for review runners. No pod gets the
# automatic token: exemplar-worker (control) alone mounts a projected one
# for the Kubernetes API, bound to rbac.yaml's Role; nothing else has RBAC.
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-webhook, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-gateway, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-worker, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-runner, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-search, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-learn, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-api, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
