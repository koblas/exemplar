# Non-secret settings shared by the services. Secrets are referenced by
# name only and supplied outside this repository (see deploy/README.md):
#   exemplar-database        url
#   exemplar-github-app      app-id, client-id, client-secret, private-key, webhook-secret,
#                            installation-id: from exemplar-api's setup page (README.md)
#   exemplar-exports-app     app-id, private-key (optional: the separate exports app)
#   exemplar-root-key        key (at least 32 bytes: openssl rand -hex 32); the link, session,
#                            gateway, search and pseudonym keys derive from it (internal/envcfg)
#   exemplar-providers       anthropic-api-key
#   exemplar-oidc            client-secret (optional: the OIDC sign-in client's)
#   exemplar-cloudflared     credentials.json (the tunnel's, Cloudflare Tunnel builds only)
#   exemplar-postgres        password (the in-cluster Postgres superuser's, components/postgres only)
apiVersion: v1
kind: ConfigMap
metadata:
  name: exemplar-settings
  namespace: exemplar
  labels:
    app.kubernetes.io/part-of: exemplar
data:
  # Set per installation by the overlay: the config repo (owner/name) and
  # exemplar-api's public URL. GitHub posts webhooks to EXEMPLAR_API_URL
  # plus /webhook unless EXEMPLAR_WEBHOOK_URL names a separate host.
  # Everything about the GitHub App (ids, keys, secrets) is in the
  # exemplar-github-app Secret, which exemplar-api's setup page produces.
  EXEMPLAR_CONFIG_REPO: "example-org/exemplar-config"
  EXEMPLAR_API_URL: "https://exemplar.example.invalid"
  EXEMPLAR_WEBHOOK_URL: ""
  # GitHub's web and API bases; for GitHub Enterprise Server,
  # https://<host>/ and https://<host>/api/v3/.
  EXEMPLAR_GH_WEB_URL: "https://github.com/"
  EXEMPLAR_GH_API_URL: "https://api.github.com/"
  # Auth0 tenant domain and API audience for service callers of
  # /v1/evaluate; both empty turns service callers off.
  EXEMPLAR_AUTH0_DOMAIN: ""
  EXEMPLAR_AUTH0_AUDIENCE: ""
  # In-cluster services.
  EXEMPLAR_GATEWAY_URL: "http://exemplar-gateway.exemplar.svc"
  EXEMPLAR_SEARCH_URL: "http://exemplar-search.exemplar.svc"
---
# Sign-in sources for exemplar-api, Coder-style (internal/api/signin.go).
# GitHub OAuth is on once the exemplar-github-app Secret has the App's
# client id. ALLOWED_ORGS defaults to the config repo's owner;
# ALLOW_EVERYONE=true opens it to any GitHub user. OIDC is on when EXEMPLAR_OIDC_ISSUER_URL is set,
# with its client secret in the exemplar-oidc Secret (client-secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: exemplar-auth
  namespace: exemplar
  labels:
    app.kubernetes.io/part-of: exemplar
data:
  # EXEMPLAR_OAUTH2_GITHUB_ALLOWED_ORGS: "acme,acme-labs"
  # EXEMPLAR_OAUTH2_GITHUB_ENTERPRISE_BASE_URL: "https://github.example.com"
  # EXEMPLAR_OIDC_ISSUER_URL: "https://acme.okta.com"
  # EXEMPLAR_OIDC_CLIENT_ID: "0oa..."
  # EXEMPLAR_OIDC_CLI_CLIENT_ID: "0ob..."
  # EXEMPLAR_OIDC_EMAIL_DOMAIN: "acme.com"
  # EXEMPLAR_OIDC_USERNAME_FIELD: "github_username"
  # EXEMPLAR_OIDC_ALLOWED_GROUPS: "engineering"
  # EXEMPLAR_OIDC_GROUP_REPOS: '{"engineering": ["acme/*"]}'
  # With both sources: connect GitHub after OIDC sign-in (required | optional | off),
  # and GitHub as a connect step only, not a sign-in button.
  # EXEMPLAR_OIDC_GITHUB_LINK: "required"
  # EXEMPLAR_OAUTH2_GITHUB_SIGN_IN: "false"
