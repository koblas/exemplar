  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1500
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: exemplar-learn, app.kubernetes.io/component: extract, app.kubernetes.io/part-of: exemplar}
        spec:
          serviceAccountName: exemplar-learn
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: extract
              image: exemplar
              command: ["/usr/local/bin/exemplar-learn"]
              args:
                - extract
                - --once
              envFrom:
                - configMapRef: {name: exemplar-otel, optional: true}
                - secretRef: {name: exemplar-otel, optional: true}
              env:
                - name: EXEMPLAR_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: exemplar-database, key: url}}
                - name: EXEMPLAR_GATEWAY_URL
                  valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_GATEWAY_URL}}
