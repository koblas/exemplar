# Compile candidates to ast-grep or Semgrep rules, after evals.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: exemplar-learn-compile
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-learn, app.kubernetes.io/component: compile, app.kubernetes.io/part-of: exemplar}
spec:
# Suspended: compile runs model-written rules only inside its unshare
  # sandbox (--require-sandbox), which needs unprivileged user namespaces.
  # RuntimeDefault seccomp under the restricted Pod Security level
  # normally refuses them. Enable once the cluster provides them (see
  # deploy/README.md); never turn the sandbox off instead.
  suspend: true
  schedule: "30 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: exemplar-learn, app.kubernetes.io/component: compile, app.kubernetes.io/part-of: exemplar}
        spec:
          serviceAccountName: exemplar-learn
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            # One sync, then exit: the job reads a fixed config.
            - name: config-sync
              image: registry.k8s.io/git-sync/git-sync:v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
              args:
                - --repo=$(EXEMPLAR_CONFIG_GIT_URL)
                - --ref=main
                - --root=/config
                - --link=current
                - --one-time
                - --ssh-key-file=/etc/git-secret/ssh
                - --ssh-known-hosts-file=/etc/git-secret/known_hosts
              env:
                - name: EXEMPLAR_CONFIG_GIT_URL
                  valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_CONFIG_GIT_URL}}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: config, mountPath: /config}
                - {name: config-git, mountPath: /etc/git-secret, readOnly: true}
                - {name: sync-tmp, mountPath: /tmp}
          containers:
            - name: compile
              image: exemplar
              command: ["/usr/local/bin/exemplar-learn"]
              args:
                - compile
                - --config=/config/current
                - --work-dir=/var/lib/exemplar/work
                - --ast-grep=/usr/local/bin/ast-grep
                - --semgrep=/usr/local/bin/semgrep
              envFrom:
                - configMapRef: {name: exemplar-otel, optional: true}
                - secretRef: {name: exemplar-otel, optional: true}
              env:
                - name: EXEMPLAR_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: exemplar-database, key: url}}
                - name: EXEMPLAR_GH_APP_ID
                  valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_GH_APP_ID}}
                - name: EXEMPLAR_GH_INSTALLATION_ID
                  valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_GH_INSTALLATION_ID}}
                - {name: EXEMPLAR_GH_PRIVATE_KEY_FILE, value: /var/run/secrets/exemplar/github-app/private-key}
                - name: EXEMPLAR_CONFIG_REPO
                  valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_CONFIG_REPO}}
                - name: EXEMPLAR_GATEWAY_URL
                  valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_GATEWAY_URL}}
                - name: EXEMPLAR_GATEWAY_TOKEN
                  valueFrom: {secretKeyRef: {name: exemplar-gateway, key: token}}
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {cpu: "2", memory: 4Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: config, mountPath: /config, readOnly: true}
                - {name: github-app, mountPath: /var/run/secrets/exemplar/github-app, readOnly: true}
                - {name: work, mountPath: /var/lib/exemplar/work}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 2Gi}
            - name: config
              emptyDir: {sizeLimit: 256Mi}
            - name: config-git
              secret: {secretName: exemplar-config-git, defaultMode: 0400}
            - name: sync-tmp
              emptyDir: {sizeLimit: 64Mi}
            - name: github-app
              secret:
                secretName: exemplar-github-app
                items: [{key: private-key, path: private-key}]
                defaultMode: 0400
            - name: work
