# The Secrets exemplar-api's setup writes (internal/setup), declared empty so
# its Role can name each one: RBAC can't narrow "create" to a name, but it can
# narrow get and patch. Setup fills them through the Kubernetes API; these
# manifests carry no data, so applying them again leaves what setup (or you)
# wrote in place. Deleting them (kubectl delete -k, or apply --prune) deletes
# the App's key with them. The in-cluster database's two are in
# components/postgres. docs/reference/secrets-and-configmaps.md lists the keys.
apiVersion: v1
kind: Secret
metadata:
  name: exemplar-setup
  namespace: exemplar
  labels: {app.kubernetes.io/part-of: exemplar}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: exemplar-github-app
  namespace: exemplar
  labels: {app.kubernetes.io/part-of: exemplar}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: exemplar-exports-app
  namespace: exemplar
  labels: {app.kubernetes.io/part-of: exemplar}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: exemplar-root-key
  namespace: exemplar
  labels: {app.kubernetes.io/part-of: exemplar}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: exemplar-providers
  namespace: exemplar
  labels: {app.kubernetes.io/part-of: exemplar}
type: Opaque
