# exemplar-runner: the pod of one review. exemplar-worker (control, with
# --launcher=kubernetes) makes a Job per review from this template, adding
# `run-job --job ID --config-version V` to the runner container's args;
# the runner loads that config version from Postgres (config_snapshots),
# so it has no config checkout. It reviews, posts with its claim's tokens
# for that one repository, and exits: 0 done, 10 cancelled, 11
# superseded, anything else retried by River.
#
# The runner never holds the App private key: exemplar-worker mints the
# job's GitHub tokens (its repository, the flavors the job needs) into a
# single-use claim, and the Job's EXEMPLAR_RUNNER_NONCE redeems it once.
apiVersion: v1
kind: PodTemplate
metadata:
  name: exemplar-runner
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-runner, app.kubernetes.io/part-of: exemplar}
template:
  metadata:
    labels:
      app.kubernetes.io/name: exemplar-runner
      app.kubernetes.io/part-of: exemplar
  spec:
    serviceAccountName: exemplar-runner
    automountServiceAccountToken: false
    restartPolicy: Never
    # A deleted Job (a superseded review) gets SIGTERM: the runner checks
    # River for the cancel (5 s) and posts the superseded notice (30 s).
    terminationGracePeriodSeconds: 60
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile: {type: RuntimeDefault}
    containers:
      - name: runner
        image: exemplar
        command: ["/usr/local/bin/exemplar-worker"]
        args:
          - --work-dir=/var/lib/exemplar/work
        # OTel destinations (internal/telemetry): optional, set per installation.
        envFrom:
          - configMapRef: {name: exemplar-otel, optional: true}
          - secretRef: {name: exemplar-otel, optional: true}
        env:
          - name: EXEMPLAR_DATABASE_URL
            valueFrom: {secretKeyRef: {name: exemplar-database, key: url}}
          - name: EXEMPLAR_GH_API_URL
            valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_GH_API_URL, optional: true}}
          - name: EXEMPLAR_GH_WEB_URL
            valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_GH_WEB_URL, optional: true}}
          - name: EXEMPLAR_CONFIG_REPO
            valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_CONFIG_REPO}}
          - name: EXEMPLAR_GATEWAY_URL
            valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_GATEWAY_URL}}
          - {name: EXEMPLAR_ROOT_KEY_FILE, value: /var/run/secrets/exemplar/root/key}
          - name: EXEMPLAR_SEARCH_URL
            valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_SEARCH_URL}}
          - {name: EXEMPLAR_AST_GREP, value: /usr/local/bin/ast-grep}
          # Signed feedback links in comments.
          - name: EXEMPLAR_API_URL
            valueFrom: {configMapKeyRef: {name: exemplar-settings, key: EXEMPLAR_API_URL}}
        # One review: git, ast-grep and Semgrep runs over the checkout on
        # the work volume. Ephemeral storage covers /tmp and logs only.
        # Re-size cpu and memory from the monorepo benchmark.
        resources:
          requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}
          limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 4Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: root-key, mountPath: /var/run/secrets/exemplar/root, readOnly: true}
          - {name: work, mountPath: /var/lib/exemplar/work}
          - {name: tmp, mountPath: /tmp}
    volumes:
      - name: root-key
        secret: {secretName: exemplar-root-key, defaultMode: 0400}
      # The review's checkout: a volume of the pod's own, from the cluster's
      # default StorageClass, deleted with the pod. exemplar-worker sizes
      # it per Job from the repo's recorded checkouts (--runner-disk-min,
      # --runner-disk-max); 8Gi is for a repo not reviewed yet. Per-pod
      # disk is what per-pod-billed platforms request, and GKE Autopilot
      # caps plain ephemeral storage at 10 GiB.
      - name: work
        ephemeral:
          volumeClaimTemplate:
            metadata:
              labels: {app.kubernetes.io/name: exemplar-runner, app.kubernetes.io/part-of: exemplar}
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests: {storage: 8Gi}
      - name: tmp
        emptyDir: {sizeLimit: 2Gi}
