# Two identities call the Kubernetes API, each with a namespaced Role:
# exemplar-worker (control), which with --launcher=kubernetes reads the
# runner PodTemplate, makes and deletes a Job per review, and reads the
# Job's pod for the runner's exit code; and exemplar-api, whose setup mode
# reads and fills the Secrets it writes (secrets.yaml), by name. Runners get
# no token and no role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exemplar-worker-runners
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-worker, app.kubernetes.io/part-of: exemplar}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [podtemplates]
    resourceNames: [exemplar-runner]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exemplar-worker-runners
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-worker, app.kubernetes.io/part-of: exemplar}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exemplar-worker-runners
subjects:
  - kind: ServiceAccount
    name: exemplar-worker
    namespace: exemplar
---
# exemplar-api's setup (internal/setup): get and patch, never create, list or
# delete, and only the Secrets it writes. App mode doesn't call the API, but
# the token stays mounted; see docs/reference/workloads.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exemplar-api-setup
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-api, app.kubernetes.io/part-of: exemplar}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [exemplar-setup, exemplar-github-app, exemplar-exports-app, exemplar-root-key, exemplar-providers, exemplar-postgres, exemplar-database]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exemplar-api-setup
  namespace: exemplar
  labels: {app.kubernetes.io/name: exemplar-api, app.kubernetes.io/part-of: exemplar}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: exemplar-api-setup
subjects:
  - kind: ServiceAccount
    name: exemplar-api
    namespace: exemplar
