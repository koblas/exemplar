# The default build: everything in core, reached through a Cloudflare Tunnel,
# so the cluster has no public ingress. Render: kubectl kustomize
# deploy/k8s/base (or an overlay built on it). For an Ingress instead, build
# deploy/k8s/direct; for both, add ../components/ingress to an overlay of this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../core
components:
  - ../components/cloudflare-tunnel
