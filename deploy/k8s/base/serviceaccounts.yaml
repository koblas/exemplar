# One identity per binary. None calls the Kubernetes API, so no token is
# mounted and there is no RBAC.
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-webhook, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-gateway, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-worker, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-search, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-learn, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: exemplar-api, namespace: exemplar, labels: {app.kubernetes.io/part-of: exemplar}}
automountServiceAccountToken: false
